name: Build

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Validate JSON
        run: |
          node -e "JSON.parse(require('fs').readFileSync('package.json','utf8'))"
          node -e "JSON.parse(require('fs').readFileSync('language-configuration.json','utf8'))"
          node -e "JSON.parse(require('fs').readFileSync('syntaxes/sls.tmLanguage.json','utf8'))"
          node -e "JSON.parse(require('fs').readFileSync('snippets/sls-snippets.json','utf8'))"

      - name: Check extension.js syntax
        run: node --check src/extension.js

      - name: Run tests
        run: node test/run.js

      - name: Package extension
        run: npx --yes @vscode/vsce package --no-dependencies

      - name: Upload .vsix artifact
        uses: actions/upload-artifact@v4
        with:
          name: salt-syntax-vsix
          path: "*.vsix"

      - name: Create Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: "*.vsix"
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-rc') }}
